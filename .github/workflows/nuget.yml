name: Build and Test

on:
  push:
    branches:
      - dev
      - main
      - master
  pull_request:
    branches:
      - dev
      - main
      - master
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (optional - overrides default)'
        required: false
        default: ''
        type: string

# Add permissions at the workflow level
permissions:
  contents: read
  packages: read
  actions: read
  checks: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/global.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: |
        dotnet restore MinimalCleanArch.slnx
        dotnet restore templates/MinimalCleanArch.Templates.csproj

    - name: Build solution
      run: dotnet build MinimalCleanArch.slnx --configuration Release --no-restore --verbosity minimal

    - name: Run tests
      run: |
        echo "Running unit tests..."
        dotnet test tests/MinimalCleanArch.UnitTests/MinimalCleanArch.UnitTests.csproj --configuration Release --no-build --verbosity minimal --logger trx --results-directory "TestResults"
        echo "Running integration tests..."
        dotnet test tests/MinimalCleanArch.IntegrationTests/MinimalCleanArch.IntegrationTests.csproj --configuration Release --no-build --verbosity minimal --logger trx --results-directory "TestResults"

    - name: Upload test results
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: test-results-${{ github.run_number }}
        path: TestResults*
        retention-days: 30
        if-no-files-found: ignore

  validate-templates:
    needs: build-and-test
    uses: ./.github/workflows/validate-templates.yml
    secrets: inherit

  pack:
    needs: [build-and-test, validate-templates]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    outputs:
      package-version: ${{ steps.get-version.outputs.version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    - name: Cache dependencies
      uses: actions/cache@v5
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props', '**/global.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore MinimalCleanArch.slnx

    - name: Determine version
      id: get-version
      run: |
        if [ -n "${{ github.event.inputs.version }}" ]; then
          VERSION="${{ github.event.inputs.version }}"
        elif [[ $GITHUB_REF == refs/tags/v* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          # Extract version from Directory.Build.props or use default
          if [ -f "src/Directory.Build.props" ]; then
            VERSION=$(grep -o '<PackageVersion>[^<]*</PackageVersion>' src/Directory.Build.props | sed 's/<[^>]*>//g')
          else
            VERSION="0.0.1-ci-${{ github.run_number }}"
          fi
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Package version: $VERSION"

    - name: Create packages
      run: |
        echo "Creating NuGet packages..."

        # Create output directory
        mkdir -p ./artifacts/packages
        rm -f ./artifacts/packages/*.nupkg ./artifacts/packages/*.snupkg

        # Pack projects in dependency order
        projects=(
          "src/MinimalCleanArch/MinimalCleanArch.csproj"
          "src/MinimalCleanArch.DataAccess/MinimalCleanArch.DataAccess.csproj"
          "src/MinimalCleanArch.Jobs/MinimalCleanArch.Jobs.csproj"
          "src/MinimalCleanArch.Realtime/MinimalCleanArch.Realtime.csproj"
          "src/MinimalCleanArch.Features/MinimalCleanArch.Features.csproj"
          "src/MinimalCleanArch.Extensions/MinimalCleanArch.Extensions.csproj"
          "src/MinimalCleanArch.Validation/MinimalCleanArch.Validation.csproj"
          "src/MinimalCleanArch.Security/MinimalCleanArch.Security.csproj"
          "src/MinimalCleanArch.Storage/MinimalCleanArch.Storage.csproj"
          "src/MinimalCleanArch.Email/MinimalCleanArch.Email.csproj"
          "src/MinimalCleanArch.Messaging/MinimalCleanArch.Messaging.csproj"
          "src/MinimalCleanArch.Audit/MinimalCleanArch.Audit.csproj"
          "templates/MinimalCleanArch.Templates.csproj"
        )

        set -e
        success_count=0
        total_count=${#projects[@]}
        fail_count=0

        for project in "${projects[@]}"; do
          if [ -f "$project" ]; then
            project_name=$(basename "$project" .csproj)
            echo "Packing: $project_name"

            extra_args=("/p:PackageVersion=${{ steps.get-version.outputs.version }}")
            if [ "$project" = "templates/MinimalCleanArch.Templates.csproj" ]; then
              extra_args+=("/p:Version=${{ steps.get-version.outputs.version }}")
            fi

            if dotnet pack "$project" \
              --configuration Release \
              --output ./artifacts/packages \
              --include-symbols \
              --verbosity minimal \
              "${extra_args[@]}"; then
              success_count=$((success_count + 1))
              echo "✓ Successfully packed $project_name"
            else
              echo "✗ Failed to pack $project_name"
              fail_count=$((fail_count + 1))
            fi
          else
            echo "Project file not found: $project"
            fail_count=$((fail_count + 1))
          fi
        done

        echo ""
        echo "Packaging Summary:"
        echo "  Total projects: $total_count"
        echo "  Successful: $success_count"
        echo "  Failed: $fail_count"
        
        if [ $fail_count -gt 0 ]; then
          echo "Error: One or more packages failed to pack."
          exit 1
        fi
        
        # List created packages
        echo ""
        echo "Created packages:"
        ls -la ./artifacts/packages/ || echo "No packages directory found"

        # Verify at least one package was created
        package_count=$(ls ./artifacts/packages/*.nupkg 2>/dev/null | wc -l)
        if [ $package_count -eq 0 ]; then
          echo "Error: No packages were created!"
          exit 1
        fi

        echo "Successfully created $package_count package(s)"

    - name: List created packages
      run: |
        echo "Created packages:"
        ls -la ./artifacts/packages/

    - name: Upload packages artifact
      uses: actions/upload-artifact@v6
      with:
        name: nuget-packages-${{ github.run_number }}
        path: ./artifacts/packages/*.nupkg
        retention-days: 90

    - name: Upload symbols artifact  
      uses: actions/upload-artifact@v6
      with:
        name: nuget-symbols-${{ github.run_number }}
        path: ./artifacts/packages/*.snupkg
        retention-days: 90
        if-no-files-found: ignore

  security-scan:
    runs-on: ubuntu-latest
    needs: [build-and-test]

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    - name: Restore dependencies
      run: dotnet restore MinimalCleanArch.slnx

    - name: Run security scan
      run: |
        dotnet list MinimalCleanArch.slnx package --vulnerable --include-transitive 2>&1 | tee security-scan.txt
        if grep -q "has the following vulnerable packages" security-scan.txt; then
          echo "::warning::Vulnerable packages detected"
          cat security-scan.txt
        else
          echo "No vulnerable packages detected"
        fi
      continue-on-error: true
