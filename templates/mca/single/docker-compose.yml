name: ${COMPOSE_PROJECT_NAME:-mca}

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
      - "5001:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
#if (UseSqlServer)
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=__DB_NAME__;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=true
#endif
#if (UsePostgres)
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=__DB_NAME__;Username=postgres;Password=postgres
#endif
#if (UseCaching)
      - Caching__Redis__ConnectionString=redis:6379
#endif
#if (UseStorage)
      - BlobStorage__ConnectionString=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
      - BlobStorage__ContainerName=app-data
#endif
#if (UseSqlServer || UsePostgres || UseCaching || UseStorage)
    depends_on:
#if (UseSqlServer)
      - sqlserver
#endif
#if (UsePostgres)
      - postgres
#endif
#if (UseCaching)
      - redis
#endif
#if (UseStorage)
      - azurite
#endif
#endif

#if (UseSqlServer)
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Passw0rd
    volumes:
      - sqlserver-data:/var/opt/mssql
#endif

#if (UsePostgres)
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=__DB_NAME__
    volumes:
      - postgres-data:/var/lib/postgresql/data
#endif

#if (UseCaching)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
#endif

#if (UseStorage)
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    volumes:
      - azurite-data:/data
#endif

#if (UseSqlServer || UsePostgres || UseCaching || UseStorage)
volumes:
#if (UseSqlServer)
  sqlserver-data:
#endif
#if (UsePostgres)
  postgres-data:
#endif
#if (UseCaching)
  redis-data:
#endif
#if (UseStorage)
  azurite-data:
#endif
#endif
